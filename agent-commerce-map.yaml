name: "The Agent Commerce Map"
version: "1.0.0"
updated: "2026-10-25"
license: "MIT"
maintainer: "Wever Labs"
repository: "https://github.com/CodeWever/agent-commerce-map"
entries:
  - id: "x402"
    name: "x402"
    description: "The open, HTTP-native payment standard. A server answers an unpaid request with 402 Payment Required, the client pays in crypto, the server serves the resource."
    categories: ["Settlement protocols"]
    status: "live"
    chain: "Any EVM chain, Solana, and more"
    asset: "Stablecoins"
    fees: "Zero protocol fees; network gas separate"
    url: "https://x402.org"
    run_by: "x402 Foundation"
    verified: "2026-10-25"
  - id: "ap2"
    name: "Google AP2 - Agent Payments Protocol"
    description: "An open protocol for agent payments built on signed, verifiable mandates (intent, cart, payment) that prove the user authorized the agent to pay for a specific purchase. Specification v0.2, donated to the FIDO Alliance."
    categories: ["Settlement protocols"]
    status: "live"
    chain: "Payment-agnostic"
    asset: "Cards, stablecoins, real-time bank transfers"
    fees: "Not published (open protocol, not a priced service)"
    url: "https://ap2-protocol.org"
    run_by: "Originated by Google with 60+ organizations; now with the FIDO Alliance"
    verified: "2026-10-25"
  - id: "mpp"
    name: "MPP - Machine Payments Protocol"
    description: "An open protocol that lets agents pay for API services, designed rail-agnostic so different payment networks can implement it. Settles on Tempo."
    categories: ["Settlement protocols"]
    status: "live"
    chain: "Rail-agnostic; settles on Tempo"
    asset: "Varies by rail"
    fees: "Not published"
    url: "https://mpp.dev"
    run_by: "Associated with Tempo (Tempo Labs)"
    verified: "2026-10-25"
  - id: "coinbase-cdp-x402-facilitator"
    name: "Coinbase CDP x402 Facilitator"
    description: "Coinbase's hosted x402 service that verifies signed payments and settles them onchain, so a seller runs no settlement infrastructure of its own."
    categories: ["Payment rails and products"]
    status: "live"
    chain: "Base, Polygon, Arbitrum, Monad, World, Solana, and more"
    asset: "ERC-20 tokens on EVM networks; SPL tokens on Solana"
    fees: "First 1,000 onchain transactions a month free, then $0.001 each; verification always free; gas separate"
    url: "https://docs.cdp.coinbase.com/x402/welcome"
    run_by: "Coinbase Developer Platform"
    verified: "2026-10-25"
  - id: "wever-pay"
    name: "Wever Pay / Wever Labs MCP"
    description: "Wever Labs' MCP-accessible money toolkit: paid tools and commerce rails settled in USDC on Base via x402. Main endpoint answers live with 57 tools, plus 13 more across dedicated split, conditional, and invoice endpoints and 6 on the money-back endpoint."
    categories: ["Payment rails and products"]
    status: "live"
    chain: "Base mainnet"
    asset: "Native USDC"
    fees: "10 free calls per wallet per rolling 30 days; then 0.10 USDC per call for most tools, 1.00 for diligenceops-paid-run, 0.25 for daily-operator-brief, 2.00 per delegated-authority mandate"
    url: "https://weverlabs.com/llms.txt"
    run_by: "Wever Labs"
    verified: "2026-10-25"
  - id: "wever-conditional-payments"
    name: "Wever conditional payments / escrow"
    description: "Locks USDC in a Base escrow contract, releases in full at a release time or on the named approver's approval, refunds in full to the payer after the deadline. Payer-only cancel before release."
    categories: ["Escrow and conditional payments"]
    status: "live"
    chain: "Base mainnet"
    asset: "Native USDC"
    fees: "0.10 USDC per call under the shared 10 free calls per wallet per rolling 30 days; maximum 300 USDC per payment"
    url: "https://weverlabs.com/conditional-payments/"
    run_by: "Wever Labs"
    parent: "Wever Pay"
    verified: "2026-10-25"
  - id: "wever-split-payments"
    name: "Wever split payments"
    description: "Splits one USDC payment across 2 to 32 recipients in a single atomic execution, by percentage or fixed amounts."
    categories: ["Splits and payouts"]
    status: "live"
    chain: "Base mainnet"
    asset: "Native USDC"
    fees: "0.10 USDC per call under the shared 10 free calls per wallet per rolling 30 days; maximum 300 USDC per split"
    url: "https://weverlabs.com/split-payments/"
    run_by: "Wever Labs"
    parent: "Wever Pay"
    verified: "2026-10-25"
  - id: "wever-invoicing"
    name: "Wever invoicing"
    description: "Creates shareable USDC invoices that an agent or human pays once via x402. Paid invoices keep their completed status. One payment authorization per invoice."
    categories: ["Invoicing"]
    status: "live"
    chain: "Base mainnet"
    asset: "Native USDC"
    fees: "0.10 USDC per call under the shared 10 free calls per wallet per rolling 30 days; maximum invoice 300 USDC"
    url: "https://weverlabs.com/invoices/"
    run_by: "Wever Labs"
    parent: "Wever Pay"
    verified: "2026-10-25"
  - id: "wever-dispute-resolution"
    name: "Wever dispute resolution rail"
    description: "Opens a dispute over a funded escrow or work order, pauses release and refund, both sides submit evidence, and the operator signs a release, refund, or split decision. Unresolved funds return to the payer after 14 days."
    categories: ["Disputes and refunds"]
    status: "live"
    chain: "Base mainnet"
    asset: "Native USDC (escrow and work-order funds)"
    fees: "0.10 USDC per call; limit 25 USDC per case and 100 USDC resolved per UTC day"
    url: "https://weverlabs.com/api/dispute-contract"
    run_by: "Wever Labs"
    parent: "Wever Pay"
    verified: "2026-10-25"
  - id: "circle-agent-stack"
    name: "Circle Agent Stack"
    description: "Policy-controlled agent wallets to hold and spend USDC, per-request x402 payments, gas-free nanopayments, and a marketplace to discover payable services."
    categories: ["Payment rails and products", "Wallet and identity for agents"]
    status: "live"
    chain: "Arbitrum, Arc, Avalanche, Base, Ethereum, Monad, Optimism, Polygon PoS, Unichain"
    asset: "USDC (also EURC)"
    fees: "Gas $0 (sponsored) on agent-wallet transactions; swap provider fee 2 bps; Gateway protocol fee 0.5 bps on cross-chain x402 payments, free same-chain; nanopayments down to $0.000001"
    url: "https://developers.circle.com/agent-stack"
    run_by: "Circle Internet Group"
    verified: "2026-10-25"
  - id: "stripe-for-ai-agents"
    name: "Stripe for AI agents"
    description: "Agent Toolkit (MCP server, skills, CLI) plus the Agentic Commerce Suite for merchants selling through agents, on Stripe's fiat and stablecoin rails."
    categories: ["Payment rails and products"]
    status: "live"
    chain: "Fiat card and bank rails; stablecoin acceptance"
    asset: "Fiat; stablecoins"
    fees: "Standard card processing 2.9% + 30 cents per successful domestic card transaction; stablecoin acceptance 1.5%; dispute fee $15.00"
    url: "https://docs.stripe.com/agents/how-it-works"
    run_by: "Stripe"
    verified: "2026-10-25"
  - id: "nevermined"
    name: "Nevermined"
    description: "Payments and monetization for AI agents: metering, pricing plans, access control, and settlement, including delegated card spending via x402."
    categories: ["Payment rails and products"]
    status: "live"
    chain: "Base, Solana, Polygon (x402); fiat via Stripe, PayPal/Braintree, Visa card delegation"
    asset: "USDC and EURC; fiat"
    fees: "Check directly; their own published pages differ (1% vs 1% to 2%)"
    url: "https://nevermined.ai"
    run_by: "Nevermined AG"
    verified: "2026-10-25"
  - id: "tempo"
    name: "Tempo"
    description: "A payments-first Layer 1 built for stablecoin payments, global payouts, agentic payments, and enterprise settlement. MPP is its companion open standard."
    categories: ["Payment rails and products"]
    status: "live"
    chain: "Tempo L1"
    asset: "USD stablecoins (TIP-20); gas paid in stablecoins"
    fees: "Not published"
    url: "https://tempo.xyz"
    run_by: "Tempo (Tempo Labs)"
    verified: "2026-10-25"
  - id: "corbits"
    name: "Corbits"
    description: "Originally an x402 API-monetization product; now a platform for deploying secure, auditable agents with organizational guardrails. Its x402 payments docs and API remain live."
    categories: ["Payment rails and products"]
    status: "live"
    chain: "Solana, Base, Polygon, Monad"
    asset: "USDC"
    fees: "Not published"
    url: "https://docs.corbits.dev/getting-started/intro"
    run_by: "Corbits"
    verified: "2026-10-25"
  - id: "skyfire"
    name: "Skyfire"
    description: "The agent trust stack: verified Know Your Agent (KYA) identity plus an agentic wallet and checkout so agents can access sites, log in, and pay on a user's behalf."
    categories: ["Wallet and identity for agents"]
    status: "live"
    chain: "Not specified"
    asset: "USDC plus tokenized card payments"
    fees: "Not published"
    url: "https://skyfire.xyz"
    run_by: "Skyfire"
    verified: "2026-10-25"
  - id: "erc-8004"
    name: "ERC-8004 - Trustless Agents"
    description: "An Ethereum draft standard giving agents portable onchain identity (an ERC-721 NFT), a reputation registry for client feedback, and a validation registry for independent checks of completed work. Payments are deliberately out of scope."
    categories: ["Wallet and identity for agents"]
    status: "draft"
    chain: "Any EVM chain"
    asset: "None (identity only)"
    fees: "None (the standard defines no fees; ordinary gas only)"
    url: "https://eips.ethereum.org/EIPS/eip-8004"
    run_by: "Open Ethereum EIP, no single company"
    verified: "2026-10-25"
  - id: "ensip-25"
    name: "ENS for agents (ENSIP-25)"
    description: "An official ENS standard that lets an ENS name verifiably link to an AI agent registered in an onchain registry such as ERC-8004, using a single text record. ENS itself is general naming infrastructure, not an agent product."
    categories: ["Wallet and identity for agents"]
    status: "live"
    chain: "Ethereum (ENS names)"
    asset: "None (naming only)"
    fees: "Not published (no agent-specific pricing)"
    url: "https://docs.ens.domains/ensip/25/"
    run_by: "ENS (community-governed)"
    verified: "2026-10-25"
  - id: "visa-intelligent-commerce"
    name: "Visa Intelligent Commerce"
    description: "Opens Visa's payment network to AI agents so they can find, shop, and buy on a consumer's behalf using tokenized AI-Ready Cards, with consumer-set spending limits and transaction controls."
    categories: ["Card rails for agents"]
    status: "pilot"
    chain: "Card network"
    asset: "Fiat card payment, not crypto"
    fees: "Not published"
    url: "https://usa.visa.com/about-visa/newsroom/press-releases.releaseId.22276.html"
    run_by: "Visa"
    verified: "2026-10-25"
  - id: "mastercard-agent-pay"
    name: "Mastercard Agent Pay"
    description: "Tokenized payment credentials (Agentic Tokens) that let AI agents buy on behalf of consumers and businesses within approved limits. Agent Pay for Machines extends this to agents paying other agents and services for digital services over x402."
    categories: ["Card rails for agents"]
    status: "pilot"
    chain: "Card network; Agent Pay for Machines settles via Base"
    asset: "Fiat; Agent Pay for Machines settles in fiat or stablecoins"
    fees: "Not published"
    url: "https://www.mastercard.com/global/en/news-and-trends/press/2026/october/Mastercard-Agent-Pay-for-Machines-in-action.html"
    run_by: "Mastercard"
    verified: "2026-10-25"
  - id: "okx-ai-agent-marketplace"
    name: "OKX AI Agent Marketplace (A2MCP)"
    description: "A marketplace where AI agents list services and hire each other, paying on delivery through escrow smart contracts or instant pay-per-call (A2MCP) transactions under one shared onchain identity."
    categories: ["Marketplaces and directories"]
    status: "live"
    chain: "Multiple EVM chains and Solana"
    asset: "USDT or USDG"
    fees: "No service fees currently; users pay gas and third-party protocol fees; providers set their own prices"
    url: "https://www.okx.com/en-ae/learn/okx-ai"
    run_by: "OKX"
    verified: "2026-10-25"
  - id: "x402-bazaar"
    name: "x402 Bazaar"
    description: "The discovery layer for x402: a machine-readable catalog of payable HTTP endpoints and MCP tools that agents can search, then pay for and call."
    categories: ["Marketplaces and directories"]
    status: "live"
    chain: "Base, Base Sepolia, Solana, Solana Devnet"
    asset: "USDC"
    fees: "Listing is free; services set their own per-call prices, paid via x402"
    url: "https://docs.x402.org/extensions/bazaar"
    run_by: "x402 Foundation"
    verified: "2026-10-25"
  - id: "mcp"
    name: "MCP - Model Context Protocol"
    description: "An open standard that lets AI applications connect to external data sources, tools, and workflows through one interface. The agent-to-tool layer, not a payment rail."
    categories: ["Communication layer"]
    status: "live"
    chain: "None"
    asset: "None"
    fees: "None (open protocol)"
    url: "https://modelcontextprotocol.io"
    run_by: "Originated by Anthropic; now with the Agentic AI Foundation under the Linux Foundation"
    verified: "2026-10-25"
  - id: "a2a"
    name: "A2A - Agent2Agent Protocol"
    description: "An open standard for agent-to-agent communication: agents discover each other via Agent Cards, delegate tasks, and share results. AP2 is designed as an extension of A2A. The agent-to-agent layer, not a payment rail."
    categories: ["Communication layer"]
    status: "live"
    chain: "None"
    asset: "None"
    fees: "None (open protocol)"
    url: "https://a2a-protocol.org"
    run_by: "Originated by Google; now with the Linux Foundation"
    verified: "2026-10-25"
